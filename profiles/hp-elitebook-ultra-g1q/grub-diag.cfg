set timeout=5
set default=0
loadfont unicode
set cmdline=
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ $? = 0 ]; then
  if [ $lockdown != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
  cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
fi
menuentry 'HP diagnostics - save logs to USB and power off' {
  linux /oma_snap/boot/vmlinuz.efi $cmdline archisobasedir=oma_snap archisolabel=OMA_SNAP arch=aarch64 cow_spacesize=2G oma_snap_diag=1 systemd.gpt_auto=no rd.systemd.gpt_auto=no loglevel=7 console=ttyAMA0,115200 console=tty0
  initrd /oma_snap/boot/initramfs.img
}
menuentry 'HP diagnostics - fallback without kernel modesetting' {
  linux /oma_snap/boot/vmlinuz.efi $cmdline archisobasedir=oma_snap archisolabel=OMA_SNAP arch=aarch64 cow_spacesize=2G oma_snap_diag=1 systemd.gpt_auto=no rd.systemd.gpt_auto=no nomodeset loglevel=7 console=ttyAMA0,115200 console=tty0
  initrd /oma_snap/boot/initramfs.img
}
menuentry 'Return to firmware' {
  exit 1
}
