[options]
Architecture = auto
HoldPkg = pacman glibc
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
# Keep the validated desktop stack until its coordinated upgrade is tested.
IgnorePkg = hyprland hyprtoolkit hyprland-guiutils

# Install the repository key and mirrorlist before activating this profile.
# The port's coordinated Omarchy pair takes precedence over upstream packages.
[oma-snap]
SigLevel = PackageRequired DatabaseRequired TrustedOnly
Include = /etc/pacman.d/oma-snap-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[omarchy]
Usage = Sync Search Install
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/edge/$arch
