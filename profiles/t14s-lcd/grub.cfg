set timeout=15
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set cmdline=
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ $? = 0 ]; then
  if [ $lockdown != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
  cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
fi
menuentry 'oma_snap - Arch ARM console prototype (RAM overlay)' {
  linux /oma_snap/boot/vmlinuz.efi $cmdline archisobasedir=oma_snap archisolabel=OMA_SNAP arch=aarch64 cow_spacesize=2G console=ttyAMA0,115200 console=tty0
  initrd /oma_snap/boot/initramfs.img
}
menuentry 'oma_snap - serial console validation (QEMU)' {
  linux /oma_snap/boot/vmlinuz.efi archisobasedir=oma_snap archisolabel=OMA_SNAP arch=aarch64 cow_spacesize=1G console=tty0 console=ttyAMA0,115200
  initrd /oma_snap/boot/initramfs.img
}
menuentry 'Return to firmware boot selection' {
  exit 1
}
menuentry 'UEFI firmware settings' {
  fwsetup
}
