[options]
Architecture = auto
HoldPkg = pacman glibc
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# Only the five manifest-verified packages built by this project are unsigned.
[oma-snap-local]
SigLevel = Never
Server = file:///var/cache/omarchy/mirror/offline

# Upstream package signatures remain mandatory, including during offline install.
[offline]
SigLevel = Required DatabaseOptional
Server = file:///var/cache/omarchy/mirror/offline
