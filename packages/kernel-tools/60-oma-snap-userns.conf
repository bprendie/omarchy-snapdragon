# The Ubuntu kernel enables an AppArmor user-namespace gate by default, but
# this Arch ARM installation does not ship Ubuntu's AppArmor policy stack.
# Allow user namespaces so Chromium and other applications can sandbox
# themselves. This does not disable Chromium's namespace or seccomp sandbox.
# Ignore a missing key when running a kernel without this Ubuntu extension.
-kernel.apparmor_restrict_unprivileged_userns = 0
